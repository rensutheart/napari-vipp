<path d="M560 570 H592" class="connector-violet" marker-end="url(#arrow-violet)"/>
<path d="M800 570 H832" class="connector-violet" marker-end="url(#arrow-violet)"/>
<path d="M1090 570 H1122" class="connector-violet" marker-end="url(#arrow-violet)"/>
<circle cx="596" cy="335" r="4.5" fill="#117ea6"/>
<path d="M596 335 V412 H1245 V482" class="connector-blue soft-dash" marker-end="url(#arrow-blue)"/>
<text x="970" y="402" class="arrow-label" text-anchor="middle"><tspan x="970" dy="0">chosen intensity image · raw or appropriately corrected</tspan></text>
<path d="M700 655 V690 H1110 V742" class="connector-violet" marker-end="url(#arrow-violet)"/>
<path d="M1360 570 H1405 V895" class="connector-amber"/>
<path d="M705 860 V895" class="connector-amber"/>
<path d="M1225 860 V895" class="connector-amber"/>
<path d="M665 895 H1405" class="connector-amber"/>
<circle cx="705" cy="895" r="5" fill="#a9680b"/>
<circle cx="1225" cy="895" r="5" fill="#a9680b"/>
<circle cx="1405" cy="895" r="5" fill="#a9680b"/>
<circle cx="665" cy="895" r="5" fill="#a9680b"/>
<path d="M665 895 V922" class="connector-amber" marker-end="url(#arrow-amber)"/>
<path d="M890 983 H942" class="connector-amber" marker-end="url(#arrow-amber)"/>
<path d="M258 834 H300 V1065 H1155 V1043" class="connector-blue" marker-end="url(#arrow-blue)"/>
<text x="720" y="1052" class="arrow-label" text-anchor="middle"><tspan x="720" dy="0">DIRECT IMAGE-LIKE &amp; QC OUTPUTS</tspan></text>
</g>
<g id="prepared-image-hub" aria-label="Prepared image inputs">
<text x="75" y="265" class="section" text-anchor="start"><tspan x="75" dy="0">PREPARED INPUTS</tspan></text>
<rect x="75" y="295" width="190" height="180" rx="18" class="card blue" />
<rect x="100" y="320" width="140" height="78" rx="12" class="image-frame" />
<circle cx="137" cy="359" r="24" fill="#2f8ab5"/>
<circle cx="171" cy="350" r="28" fill="#9b4f86"/>
<circle cx="201" cy="372" r="22" fill="#2d8b69"/>
<text x="170" y="432" class="card-title-sm" text-anchor="middle"><tspan x="170" dy="0">Multidimensional</tspan></text>
<text x="170" y="459" class="card-title-sm" text-anchor="middle"><tspan x="170" dy="0">intensity image(s)</tspan></text>
<text x="170" y="525" class="body-sm" text-anchor="middle"><tspan x="170" dy="0">one or more channels</tspan><tspan x="170" dy="31">optional ROI or mask</tspan><tspan x="170" dy="31">calibration when available</tspan></text>
<rect x="112" y="640" width="116" height="28" rx="14" class="mini-card" fill="#ffffff" stroke="#117ea6"/>
<text x="170" y="659" class="chip-text" text-anchor="middle" style="fill:#117ea6"><tspan x="170" dy="0">IMAGE</tspan></text>
<text x="170" y="735" class="small" text-anchor="middle"><tspan x="170" dy="0">Completed image-like outputs</tspan><tspan x="170" dy="24">remain available for preview</tspan><tspan x="170" dy="24">or full-resolution inspection.</tspan></text>
<rect x="82" y="820" width="176" height="28" rx="14" class="mini-card" fill="#ffffff" stroke="#117ea6"/>
<text x="170" y="839" class="chip-text" text-anchor="middle" style="fill:#117ea6"><tspan x="170" dy="0">IMAGE-LIKE + QC</tspan></text>
</g>
<g id="image-preparation-restoration" aria-label="Image preparation and restoration lane">
<text x="350" y="252" class="section" text-anchor="start"><tspan x="350" dy="0">IMAGE PREPARATION &amp; RESTORATION</tspan></text>
<rect x="360" y="282" width="220" height="96" rx="15" class="card blue" />
<text x="470" y="316" class="card-title-sm" text-anchor="middle"><tspan x="470" dy="0">Prepare data</tspan></text>
<text x="470" y="344" class="small" text-anchor="middle"><tspan x="470" dy="0">channels · axes · regions</tspan><tspan x="470" dy="22">data type · projections</tspan></text>
<rect x="620" y="282" width="240" height="96" rx="15" class="card green" />
<text x="740" y="316" class="card-title-sm" text-anchor="middle"><tspan x="740" dy="0">Filter / correct</tspan></text>
<text x="740" y="344" class="small" text-anchor="middle"><tspan x="740" dy="0">denoise · background</tspan><tspan x="740" dy="22">detail and edge filters</tspan></text>
<rect x="920" y="230" width="240" height="60" rx="14" class="card blue" />
<text x="1040" y="256" class="card-title-sm" text-anchor="middle"><tspan x="1040" dy="0">PSF input</tspan></text>
<text x="1040" y="278" class="small" text-anchor="middle"><tspan x="1040" dy="0">measured/generated · validated</tspan></text>
<rect x="920" y="305" width="240" height="75" rx="15" class="card green optional" />
<text x="1040" y="332" class="card-title-sm" text-anchor="middle"><tspan x="1040" dy="0">RL / RL-TV restoration</tspan></text>
<text x="1040" y="359" class="body-sm" text-anchor="middle"><tspan x="1040" dy="0">2D or 3D · optional branch</tspan></text>
<rect x="1215" y="329" width="120" height="28" rx="14" class="mini-card" fill="#ffffff" stroke="#23816f"/>
<text x="1275" y="348" class="chip-text" text-anchor="middle" style="fill:#23816f"><tspan x="1275" dy="0">IMAGE</tspan></text>
</g>
<g id="segmentation-measurement" aria-label="Segmentation object separation and measurement lane">
<text x="350" y="455" class="section" text-anchor="start"><tspan x="350" dy="0">SEGMENTATION, OBJECT SEPARATION &amp; MEASUREMENT</tspan></text>
<rect x="360" y="490" width="200" height="165" rx="16" class="card rose" />
<text x="460" y="525" class="card-title-sm" text-anchor="middle"><tspan x="460" dy="0">Create a mask</tspan></text>
<text x="460" y="558" class="body-sm" text-anchor="middle"><tspan x="460" dy="0">global or local threshold</tspan><tspan x="460" dy="27">binary output</tspan></text>
<rect x="405" y="610" width="110" height="28" rx="14" class="mini-card" fill="#ffffff" stroke="#b63e72"/>
<text x="460" y="629" class="chip-text" text-anchor="middle" style="fill:#b63e72"><tspan x="460" dy="0">MASK</tspan></text>
<rect x="600" y="490" width="200" height="165" rx="16" class="card rose" />
<text x="700" y="525" class="card-title-sm" text-anchor="middle"><tspan x="700" dy="0">Clean the mask</tspan></text>
<text x="700" y="558" class="body-sm" text-anchor="middle"><tspan x="700" dy="0">morphology · holes</tspan><tspan x="700" dy="27">small objects · outliers</tspan></text>
<rect x="645" y="610" width="110" height="28" rx="14" class="mini-card" fill="#ffffff" stroke="#b63e72"/>
<text x="700" y="629" class="chip-text" text-anchor="middle" style="fill:#b63e72"><tspan x="700" dy="0">MASK</tspan></text>
<rect x="840" y="490" width="250" height="165" rx="16" class="card rose" />
<text x="965" y="525" class="card-title-sm" text-anchor="middle"><tspan x="965" dy="0">Separate / label objects</tspan></text>
<text x="965" y="558" class="body-sm" text-anchor="middle"><tspan x="965" dy="0">connected components</tspan><tspan x="965" dy="27">or watershed</tspan></text>
<rect x="895" y="610" width="140" height="28" rx="14" class="mini-card" fill="#ffffff" stroke="#9e3b8d"/>
<text x="965" y="629" class="chip-text" text-anchor="middle" style="fill:#9e3b8d"><tspan x="965" dy="0">LABEL IMAGE</tspan></text>
<rect x="1130" y="490" width="230" height="165" rx="16" class="card amber" />
<text x="1245" y="518" class="card-title-sm" text-anchor="middle"><tspan x="1245" dy="0">Object, intensity</tspan><tspan x="1245" dy="26">&amp; mesh measurements</tspan></text>
<text x="1245" y="580" class="small" text-anchor="middle"><tspan x="1245" dy="0">physical quantities when</tspan><tspan x="1245" dy="23">valid calibration is available</tspan></text>
<rect x="1190" y="614" width="110" height="28" rx="14" class="mini-card" fill="#ffffff" stroke="#a9680b"/>
<text x="1245" y="633" class="chip-text" text-anchor="middle" style="fill:#a9680b"><tspan x="1245" dy="0">TABLE</tspan></text>
</g>
<g id="specialized-analysis" aria-label="Colocalization and skeleton analysis lane">
<text x="350" y="735" class="section" text-anchor="start"><tspan x="350" dy="0">SPECIALIZED ANALYSIS BRANCHES</tspan></text>
<rect x="360" y="750" width="460" height="110" rx="16" class="card amber" />
<text x="590" y="780" class="card-title-sm" text-anchor="middle"><tspan x="590" dy="0">Colocalization &amp; spatial association</tspan></text>
<text x="590" y="808" class="body-sm" text-anchor="middle"><tspan x="590" dy="0">two channels · optional ROI/labels · visual QC + metrics</tspan></text>
<rect x="395" y="824" width="132" height="28" rx="14" class="mini-card" fill="#ffffff" stroke="#a9680b"/>
<text x="461" y="843" class="chip-text" text-anchor="middle" style="fill:#a9680b"><tspan x="461" dy="0">QC IMAGE</tspan></text>
<rect x="650" y="824" width="110" height="28" rx="14" class="mini-card" fill="#ffffff" stroke="#a9680b"/>
<text x="705" y="843" class="chip-text" text-anchor="middle" style="fill:#a9680b"><tspan x="705" dy="0">TABLE</tspan></text>
<rect x="870" y="750" width="480" height="110" rx="16" class="card amber" />
<text x="1110" y="780" class="card-title-sm" text-anchor="middle"><tspan x="1110" dy="0">Skeleton &amp; network analysis</tspan></text>
<text x="1110" y="808" class="body-sm" text-anchor="middle"><tspan x="1110" dy="0">binary mask → skeletonize → branch/network QC</tspan></text>
<rect x="915" y="824" width="145" height="28" rx="14" class="mini-card" fill="#ffffff" stroke="#a9680b"/>
<text x="987.5" y="843" class="chip-text" text-anchor="middle" style="fill:#a9680b"><tspan x="987.5" dy="0">QC MASK/LABEL</tspan></text>
<rect x="1170" y="824" width="110" height="28" rx="14" class="mini-card" fill="#ffffff" stroke="#a9680b"/>
<text x="1225" y="843" class="chip-text" text-anchor="middle" style="fill:#a9680b"><tspan x="1225" dy="0">TABLE</tspan></text>
</g>
<g id="table-composition-and-output" aria-label="Table composition and scientific outputs">
<rect x="440" y="930" width="450" height="105" rx="18" class="card amber" />
<text x="665" y="970" class="card-title" text-anchor="middle"><tspan x="665" dy="0">Compose analysis-ready tables</tspan></text>
<text x="665" y="1004" class="body-sm" text-anchor="middle"><tspan x="665" dy="0">merge · select columns · add metadata · summarize</tspan></text>
<rect x="950" y="930" width="410" height="105" rx="18" class="card neutral" />
<text x="1155" y="970" class="card-title" text-anchor="middle"><tspan x="1155" dy="0">Inspect, save, or batch</tspan></text>
<text x="1155" y="1004" class="body-sm" text-anchor="middle"><tspan x="1155" dy="0">images · masks · label images · CSV / TSV tables</tspan></text>
</g>
</svg>

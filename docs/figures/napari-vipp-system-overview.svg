<rect x="112" y="278" width="50" height="40" rx="6" class="mini-card" fill="#ffffff" stroke="#117ea6"/>
<text x="170" y="270" class="card-title-sm" text-anchor="start"><tspan x="170" dy="0">napari</tspan></text>
<text x="170" y="298" class="card-title-sm" text-anchor="start"><tspan x="170" dy="0">layer</tspan></text>
<text x="170" y="332" class="small" text-anchor="start"><tspan x="170" dy="0">Image / Labels</tspan></text>

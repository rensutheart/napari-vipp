<text x="1226" y="636" class="small" text-anchor="start"><tspan x="1226" dy="0">batch manifests</tspan><tspan x="1226" dy="18">execution</tspan><tspan x="1226" dy="18">provenance</tspan></text>
</g>
<g id="scientific-context-band" aria-label="Scientific context carried through execution">

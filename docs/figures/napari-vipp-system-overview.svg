<path d="M95 425h33.6l13.6 13.6v46.4h-47.2z" fill="#ffffff" stroke="#117ea6" stroke-width="3" vector-effect="non-scaling-stroke"/><path d="M128.6 425v13.6h13.6" fill="none" stroke="#117ea6" stroke-width="3" vector-effect="non-scaling-stroke"/>
<text x="155" y="425" class="card-title-xs" text-anchor="start"><tspan x="155" dy="0">Files / stores</tspan></text>
<text x="155" y="452" class="small" text-anchor="start"><tspan x="155" dy="0">OME-TIFF</tspan><tspan x="155" dy="21">OME-Zarr · TIFF</tspan><tspan x="155" dy="21">NumPy</tspan></text>
<rect x="75" y="570" width="205" height="135" rx="16" class="card blue" />
<circle cx="113" cy="608" r="15" fill="#238ab3"/>
<circle cx="147" cy="624" r="12" fill="#63adcc"/>
<circle cx="122" cy="651" r="19" fill="#3e97bd"/>
<text x="160" y="610" class="card-title-sm" text-anchor="start"><tspan x="160" dy="0">Samples &amp;</tspan></text>
<text x="160" y="638" class="card-title-sm" text-anchor="start"><tspan x="160" dy="0">readers</tspan></text>
<text x="160" y="668" class="small" text-anchor="start"><tspan x="160" dy="0">bundled samples</tspan><tspan x="160" dy="20">optional readers</tspan></text>
</g>
<g id="napari-workspace" aria-label="napari viewer and VIPP workflow">
<text x="375" y="190" class="section" text-anchor="start"><tspan x="375" dy="0">2 · ONE NAPARI WORKSPACE</tspan></text>
<rect x="380" y="220" width="400" height="190" rx="18" class="card navy" />
<rect x="405" y="252" width="150" height="118" rx="14" class="image-frame" />
<circle cx="448" cy="308" r="31" fill="#2f8ab5"/>
<circle cx="489" cy="298" r="35" fill="#9b4f86"/>

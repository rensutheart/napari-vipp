<path d="M615 455 V422" class="connector-violet" marker-end="url(#arrow-violet)"/>
<text x="505" y="447" class="arrow-label" text-anchor="middle"><tspan x="505" dy="0">snapshot</tspan></text>
<text x="655" y="447" class="arrow-label" text-anchor="middle"><tspan x="655" dy="0">inspect / pin</tspan></text>
<rect x="380" y="470" width="400" height="245" rx="18" class="card violet" />
<path d="M450 570H480V550H505" class="connector"/>
<path d="M450 570H480V600H505" class="connector"/>
<rect x="400" y="550" width="50" height="50" rx="9" class="mini-card" fill="#ffffff" stroke="#117ea6"/>
<rect x="505" y="540" width="55" height="42" rx="9" class="mini-card" fill="#ffffff" stroke="#7251b5"/>
<rect x="505" y="588" width="55" height="42" rx="9" class="mini-card" fill="#ffffff" stroke="#23816f"/>
<text x="610" y="515" class="card-title" text-anchor="middle"><tspan x="610" dy="0">VIPP workflow editor</tspan></text>
<text x="690" y="552" class="body-sm" text-anchor="middle"><tspan x="690" dy="0">author a typed graph</tspan><tspan x="690" dy="28">tune parameters</tspan><tspan x="690" dy="28">inspect intermediate</tspan><tspan x="690" dy="28">results</tspan></text>
<rect x="475" y="665" width="260" height="28" rx="14" class="mini-card" fill="#ffffff" stroke="#7251b5"/>
<text x="605" y="684" class="chip-text" text-anchor="middle" style="fill:#7251b5"><tspan x="605" dy="0">IMAGE · MASK · LABELS · TABLE</tspan></text>
</g>
<g id="workflow-execution" aria-label="Workflow execution">
<text x="880" y="205" class="section" text-anchor="start"><tspan x="880" dy="0">3 · EXECUTION</tspan></text>
<rect x="880" y="235" width="200" height="120" rx="16" class="card green" />
<text x="980" y="275" class="card-title-sm" text-anchor="middle"><tspan x="980" dy="0">Typed graph</tspan></text>
<text x="980" y="308" class="small" text-anchor="middle"><tspan x="980" dy="0">semantic axes</tspan><tspan x="980" dy="24">physical-grid contracts</tspan></text>
<rect x="880" y="385" width="200" height="135" rx="16" class="card green" />
<text x="980" y="430" class="card-title-sm" text-anchor="middle"><tspan x="980" dy="0">CPU reference</tspan></text>
<text x="980" y="464" class="body-sm" text-anchor="middle"><tspan x="980" dy="0">portable scientific</tspan><tspan x="980" dy="27">kernels</tspan></text>
<rect x="880" y="550" width="200" height="155" rx="16" class="card green optional" />
<text x="980" y="594" class="card-title-sm" text-anchor="middle"><tspan x="980" dy="0">Optional GPU</tspan></text>
<text x="980" y="626" class="card-title-sm" text-anchor="middle"><tspan x="980" dy="0">acceleration</tspan></text>
<text x="980" y="662" class="small" text-anchor="middle"><tspan x="980" dy="0">eligible CUDA segments</tspan><tspan x="980" dy="24">visible CPU fallback</tspan></text>
</g>
<g id="results-and-reuse" aria-label="Results and reproducibility">

<text x="828" y="437" class="arrow-label" text-anchor="middle"><tspan x="828" dy="0">run</tspan></text>
<text x="1127" y="437" class="arrow-label" text-anchor="middle"><tspan x="1127" dy="0">accept</tspan></text>
</g>
<g id="scientific-inputs" aria-label="Scientific input sources">
<text x="75" y="205" class="section" text-anchor="start"><tspan x="75" dy="0">1 · SCIENTIFIC INPUTS</tspan></text>
<rect x="75" y="235" width="205" height="130" rx="16" class="card blue" />
<rect x="92" y="260" width="50" height="40" rx="6" class="mini-card" fill="#ffffff" stroke="#117ea6"/>

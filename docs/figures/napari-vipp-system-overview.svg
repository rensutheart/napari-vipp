<path d="M1178 365h16.8l6.8 6.8v23.2h-23.6z" fill="#ffffff" stroke="#a9680b" stroke-width="3" vector-effect="non-scaling-stroke"/><path d="M1194.8 365v6.8h6.8" fill="none" stroke="#a9680b" stroke-width="3" vector-effect="non-scaling-stroke"/>

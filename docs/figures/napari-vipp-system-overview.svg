<text x="105" y="834" class="section" text-anchor="start"><tspan x="105" dy="0">SCIENTIFIC CONTEXT</tspan></text>
<text x="360" y="834" class="body-sm" text-anchor="start"><tspan x="360" dy="0">semantic axes · scale and units · source revision · actual implementation record</tspan></text>

<text x="585" y="307" class="body-sm" text-anchor="start" style="fill:#e8edf5"><tspan x="585" dy="0">full-resolution layers</tspan><tspan x="585" dy="26">linked dimensions</tspan><tspan x="585" dy="26">comparison overlays</tspan></text>

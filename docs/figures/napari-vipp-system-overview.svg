<line x1="1187" y1="513" x2="1207" y2="513" class="connector-amber"/>
<text x="1226" y="495" class="card-title-xs" text-anchor="start"><tspan x="1226" dy="0">Workflow reuse</tspan></text>
<text x="1226" y="521" class="small" text-anchor="start"><tspan x="1226" dy="0">workflow JSON</tspan><tspan x="1226" dy="18">generated Python</tspan></text>

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-vipp"
version = "0.13.0a5"
description = "Visual image processing made approachable"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [
    {name = "Rensu P. Theart"},
]
license = "BSD-3-Clause"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "bioimage analysis",
    "fluorescence microscopy",
    "image processing",
    "napari",
    "node graph",
    "visual programming",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: napari",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "dask[array]>=2025.2",
    "fsspec>=2024.2",
    "imageio>=2.31",
    "numpy>=1.24",
    "ome-types>=0.6",
    "ome-zarr>=0.17",
    "pillow>=10",
    "qtpy>=2.4",
    "scikit-image>=0.21",
    "scipy>=1.10",
    "tifffile>=2023.8",
    "zarr>=3.0",
]

[project.scripts]
vipp = "napari_vipp.__main__:main"
vipp-compute-doctor = "napari_vipp.core.compute_diagnostics:main"
vipp-install-plan = "napari_vipp.installer.cli:main"

[project.gui-scripts]
vipp-app = "napari_vipp.launcher:main_auto"
vipp-cpu = "napari_vipp.launcher:main_cpu"
vipp-prefer-gpu = "napari_vipp.launcher:main_prefer_gpu"

[project.urls]
Homepage = "https://github.com/rensutheart/napari-vipp"
Documentation = "https://rensutheart.github.io/vipp-mkdocs/"
Repository = "https://github.com/rensutheart/napari-vipp"
Issues = "https://github.com/rensutheart/napari-vipp/issues"
Discussions = "https://github.com/rensutheart/napari-vipp/discussions"

[project.optional-dependencies]
app = [
    "napari[pyqt6]>=0.6",
]
gpu-cuda12 = [
    "numpy==2.5.1; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "scipy==1.18.0; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "scikit-image==0.26.0; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "cupy-cuda12x[ctk]==14.1.1; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "cuda-pathfinder==1.6.0; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "cuda-toolkit==12.9.2.0; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "nvidia-cublas-cu12==12.9.2.10; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "nvidia-cuda-nvrtc-cu12==12.9.86; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "nvidia-cuda-runtime-cu12==12.9.79; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "nvidia-cufft-cu12==11.4.1.4; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "nvidia-curand-cu12==10.3.10.19; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "nvidia-cusolver-cu12==11.7.5.82; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "nvidia-cusparse-cu12==12.5.10.65; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "nvidia-nvjitlink-cu12==12.9.86; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
]
gpu-cuda13 = [
    "numpy==2.5.1; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "scipy==1.18.0; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "scikit-image==0.26.0; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "cupy-cuda13x[ctk]==14.1.1; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "cuda-pathfinder==1.6.0; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "cuda-toolkit==13.2.2; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "nvidia-cublas==13.4.1.3; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "nvidia-cuda-nvrtc==13.2.86; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "nvidia-cuda-runtime==13.2.86; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "nvidia-cufft==12.2.0.57; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "nvidia-curand==10.4.2.66; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "nvidia-cusolver==12.2.0.11; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "nvidia-cusparse==12.7.10.12; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
    "nvidia-nvjitlink==13.2.86; python_version == '3.12' and (platform_system == 'Windows' or platform_system == 'Linux')",
]
czi = [
    "bioio>=3.4",
    "bioio-czi",
    "czifile[all]>=2026.6.12; python_version >= '3.12'",
]
dev = [
    "build>=1.2",
    "napari[pyqt6]>=0.6",
    "npe2>=0.8",
    "numpy==2.5.1",
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.12",
    "scikit-image==0.26.0",
    "scipy==1.18.0",
]
installer-build = [
    "altgraph==0.17.5",
    "build==1.5.0",
    "pefile==2024.8.26",
    "pyinstaller==6.21.0",
    "pyinstaller-hooks-contrib==2026.6",
    "PyQt6==6.11.0",
    "PyQt6-Qt6==6.11.0",
    "PyQt6-sip==13.11.1",
    "pywin32-ctypes==0.2.3",
    "setuptools==82.0.1",
    "wheel==0.47.0",
]
bioformats = [
    "bioio>=3.4",
    "bioio-bioformats",
    "bioio-czi",
    "bioio-lif",
]
microscope = [
    "bioio>=3.4",
    "bioio-bioformats",
    "bioio-czi",
    "bioio-lif",
    "czifile[all]>=2026.6.12; python_version >= '3.12'",
    "liffile[all]>=2026.4.11; python_version >= '3.12'",
    "nd2>=0.11",
    "oiffile[all]>=2026.2.8; python_version >= '3.11'",
    "oirfile[all]>=2026.4.25; python_version >= '3.12'",
]
nd2 = [
    "nd2>=0.11",
]

[project.entry-points."napari.manifest"]
napari-vipp = "napari_vipp:napari.yaml"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["napari_vipp._tests*"]

[tool.setuptools.package-data]
napari_vipp = [
    "napari.yaml",
    "assets/branding/*.svg",
    "examples/*.json",
    "compute_policies/*.json",
]

[tool.pytest.ini_options]
testpaths = ["src/napari_vipp/_tests"]
addopts = ["-ra"]
markers = [
    "real_cuda: opt-in tests that require and verify a real CUDA device",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

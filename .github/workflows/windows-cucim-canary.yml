name: Windows cuCIM release canary

on:
  schedule:
    # The hosted job verifies the published no-wheel bundle every Monday.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published prerelease tag whose bundle should be checked
        required: true
        default: v0.13.0a6
        type: string
      run_real_canary:
        description: Also use the protected, self-hosted CUDA canary environment
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-cucim-canary
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  CANARY_TAG: ${{ inputs.release_tag || vars.VIPP_CUCIM_CANARY_TAG || 'v0.13.0a6' }}

jobs:
  published-bundle-contract:
    name: Published no-wheel bundle contract
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out the exact released source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || vars.VIPP_CUCIM_CANARY_TAG || 'v0.13.0a6' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the pinned bundle Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Rebuild and compare the published deterministic bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($env:CANARY_TAG -ne "v$version") {
            throw "The selected release tag does not match project version $version."
          }
          if ((git describe --tags --exact-match) -ne $env:CANARY_TAG) {
            throw "The checkout is not at the exact selected release tag."
          }

          $assetName = "napari-vipp-cucim-installer-$version-windows.zip"
          $canaryRoot = Join-Path $env:RUNNER_TEMP "vipp-cucim-bundle-$env:GITHUB_RUN_ID"
          $generatedRoot = Join-Path $canaryRoot "generated"
          $publishedRoot = Join-Path $canaryRoot "published"
          New-Item -ItemType Directory -Path $generatedRoot, $publishedRoot | Out-Null
          $generated = Join-Path $generatedRoot $assetName
          $published = Join-Path $publishedRoot $assetName
          python scripts/package_cucim_windows_installer.py `
            --output $generated
          gh release download $env:CANARY_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $assetName `
            --dir $publishedRoot

          $generatedHash = (Get-FileHash -LiteralPath $generated -Algorithm SHA256).Hash
          $publishedHash = (Get-FileHash -LiteralPath $published -Algorithm SHA256).Hash
          if ($generatedHash -ne $publishedHash) {
            throw "The published cuCIM bundle is not reproducible from $env:CANARY_TAG."
          }

          $commit = git rev-parse HEAD
          python -c "import json, pathlib, sys, zipfile; archive_path = pathlib.Path(sys.argv[1]); version = sys.argv[2]; commit = sys.argv[3]; archive = zipfile.ZipFile(archive_path); names = archive.namelist(); assert 'bundle-manifest.json' in names; assert not any(name.lower().endswith('.whl') for name in names); manifest = json.loads(archive.read('bundle-manifest.json')); assert manifest['vipp_version'] == version; assert manifest['source_commit'] == commit; assert manifest['contains_prebuilt_cucim_wheel'] is False; assert manifest['entrypoint'] == 'Install VIPP cuCIM.cmd'" $published $version $commit

      - name: Retain the reproducibility evidence briefly
        uses: actions/upload-artifact@v6
        with:
          name: cucim-bundle-canary-${{ env.CANARY_TAG }}-${{ github.run_id }}
          path: ${{ runner.temp }}/vipp-cucim-bundle-${{ github.run_id }}/generated/*
          if-no-files-found: error
          retention-days: 7

  real-cuda-canary:
    name: Optional real Windows CUDA build and admission
    needs: published-bundle-contract
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_real_canary) ||
      (github.event_name == 'schedule' && vars.VIPP_CUCIM_CANARY_ENABLED == 'true')
    runs-on: [self-hosted, windows, x64, vipp-cuda13]
    environment: cuda-canary
    timeout-minutes: 240
    env:
      TARGET_PYTHON: ${{ vars.VIPP_CUCIM_CANARY_PYTHON }}
      CONFIGURED_WORK_ROOT: ${{ vars.VIPP_CUCIM_CANARY_WORK_ROOT }}

    steps:
      - name: Check out the exact released source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || vars.VIPP_CUCIM_CANARY_TAG || 'v0.13.0a6' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the coordinator Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download the official bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($env:CANARY_TAG -ne "v$version") {
            throw "The selected release tag does not match project version $version."
          }
          $assetName = "napari-vipp-cucim-installer-$version-windows.zip"
          $downloadRoot = Join-Path $env:RUNNER_TEMP "vipp-cucim-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $downloadRoot | Out-Null
          gh release download $env:CANARY_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $assetName `
            --dir $downloadRoot
          Expand-Archive -LiteralPath (Join-Path $downloadRoot $assetName) `
            -DestinationPath (Join-Path $downloadRoot "bundle")
          "VIPP_CUCIM_CANARY_BUNDLE=$(Join-Path $downloadRoot 'bundle')" >> $env:GITHUB_ENV

      - name: Run the pinned local build and admission
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TARGET_PYTHON)) {
            throw "Configure VIPP_CUCIM_CANARY_PYTHON in the protected cuda-canary environment."
          }
          $targetPython = (Resolve-Path -LiteralPath $env:TARGET_PYTHON -ErrorAction Stop).Path
          if (-not (Test-Path -LiteralPath $targetPython -PathType Leaf)) {
            throw "The configured canary interpreter is not a file."
          }
          Write-Output "::add-mask::$targetPython"

          $stateRoot = Join-Path $env:RUNNER_TEMP "vipp-cucim-canary-state-$env:GITHUB_RUN_ID"
          $workRoot = $env:CONFIGURED_WORK_ROOT
          if ([string]::IsNullOrWhiteSpace($workRoot)) {
            $workRoot = Join-Path $env:RUNNER_TEMP "vipp-cucim-canary-work"
          }
          Write-Output "::add-mask::$workRoot"
          $evidenceRoot = Join-Path $env:RUNNER_TEMP "vipp-cucim-canary-evidence-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $evidenceRoot | Out-Null
          $installer = Join-Path $env:VIPP_CUCIM_CANARY_BUNDLE "scripts\install_cucim_windows.ps1"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installer `
            -TargetPython $targetPython `
            -StateRoot $stateRoot `
            -WorkRoot $workRoot
          if ($LASTEXITCODE -ne 0) {
            throw "The pinned cuCIM build or installation failed with exit $LASTEXITCODE."
          }

          & $targetPython -m napari_vipp.core.compute_diagnostics `
            --track cuda13 --refresh `
            --support-bundle (Join-Path $evidenceRoot "compute-support.json")
          if ($LASTEXITCODE -ne 0) {
            throw "Compute Doctor rejected the configured CUDA environment."
          }

          & $targetPython -c "import json; from napari_vipp.core.compute_registry import ComputeRegistry; result = ComputeRegistry().probe_library('cucim', refresh=True); print(json.dumps(result.as_dict(), indent=2, sort_keys=True)); assert result.available, result.message"
          if ($LASTEXITCODE -ne 0) {
            throw "VIPP rejected the installed cuCIM provider or its representative probes."
          }

          $harness = Join-Path $PWD "scripts\run_gpu_admission.py"
          if (Test-Path -LiteralPath $harness -PathType Leaf) {
            & $targetPython $harness --check
            if ($LASTEXITCODE -ne 0) {
              throw "The public GPU admission manifest is incomplete."
            }
            & $targetPython $harness `
              --profile quick `
              --output (Join-Path $evidenceRoot "gpu-admission-aggregate.json") `
              --artifacts (Join-Path $evidenceRoot "operation-evidence") `
              --device-index 0
            if ($LASTEXITCODE -ne 0) {
              throw "The real-GPU quick admission profile failed."
            }
          }
          else {
            @{
              schema = "napari-vipp-gpu-admission-canary-status"
              schema_version = 1
              release_tag = $env:CANARY_TAG
              status = "not_available_in_this_release"
              explanation = "This tagged release predates the aggregate GPU admission harness."
            } | ConvertTo-Json | Set-Content `
              -LiteralPath (Join-Path $evidenceRoot "gpu-admission-status.json") `
              -Encoding utf8
            Write-Warning "The selected pre-harness release received the representative cuCIM probe only."
          }

      - name: Retain redacted Doctor and admission evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: real-cuda-canary-${{ env.CANARY_TAG }}-${{ github.run_id }}
          path: ${{ runner.temp }}/vipp-cucim-canary-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7

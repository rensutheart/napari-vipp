name: CI

env:
  PYTHONUTF8: "1"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and package checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "twine>=6"

      - name: Validate napari manifest
        run: python -m npe2 validate src/napari_vipp/napari.yaml

      - name: Lint
        run: python -m ruff check .

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test built wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip check
          python -m npe2 validate napari-vipp
          python -c "from importlib.metadata import version; from importlib.resources import files; import napari_vipp; root = files('napari_vipp'); assert napari_vipp.__version__ == version('napari-vipp'); assert root.joinpath('napari.yaml').is_file(); assert root.joinpath('assets', 'branding', 'vipp-logo-dark.svg').is_file(); assert root.joinpath('assets', 'branding', 'vipp-mark.svg').is_file(); assert root.joinpath('compute_policies', 'phase1-gpu-public-v8.json').is_file(); assert any(root.joinpath('examples').iterdir())"
          python -c "from importlib.metadata import distribution; points = {(point.group, point.name, point.value) for point in distribution('napari-vipp').entry_points}; expected = {('console_scripts', 'vipp', 'napari_vipp.__main__:main'), ('console_scripts', 'vipp-install-plan', 'napari_vipp.installer.cli:main'), ('gui_scripts', 'vipp-app', 'napari_vipp.launcher:main_auto'), ('gui_scripts', 'vipp-cpu', 'napari_vipp.launcher:main_cpu'), ('gui_scripts', 'vipp-prefer-gpu', 'napari_vipp.launcher:main_prefer_gpu')}; assert expected <= points"
          vipp-install-plan --help
          python -c "import json, pathlib, shutil, subprocess, sys, tempfile; command = shutil.which('vipp-install-plan'); assert command; root = pathlib.Path(tempfile.mkdtemp(prefix='vipp-plan-wheel-')); target = root / 'target'; result = subprocess.run([command, 'plan', '--mode', 'managed', '--track', 'cpu', '--base-python', sys.executable, '--install-root', str(target), '--shortcuts', 'none'], capture_output=True, text=True, timeout=30); document = json.loads(result.stdout); assert result.returncode == 2; assert document['schema'] == 'napari-vipp-install-plan'; assert document['mutation_performed'] is False; assert not target.exists()"

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    env:
      PYTEST_QT_API: pyqt6
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

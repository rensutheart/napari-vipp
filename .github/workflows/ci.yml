name: CI

env:
  PYTHONUTF8: "1"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and package checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "twine>=6"

      - name: Validate napari manifest
        run: python -m npe2 validate src/napari_vipp/napari.yaml

      - name: Lint
        run: python -m ruff check .

      - name: Build distributions
        run: python -m build

      - name: Reject retired provider files in release archives
        run: |
          python -c "import pathlib; from scripts.package_windows_installer import retired_provider_paths_in_release_archive as retired; wheels = list(pathlib.Path('dist').glob('*.whl')); sdists = list(pathlib.Path('dist').glob('*.tar.gz')); assert len(wheels) == len(sdists) == 1, (wheels, sdists); assert not retired(wheels[0]), retired(wheels[0]); assert not retired(sdists[0]), retired(sdists[0])"

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test built wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip check
          python -m npe2 validate napari-vipp
          python -c "from importlib.metadata import version; from importlib.resources import files; import napari_vipp; root = files('napari_vipp'); assert napari_vipp.__version__ == version('napari-vipp'); assert root.joinpath('napari.yaml').is_file(); assert root.joinpath('assets', 'branding', 'vipp-logo-dark.svg').is_file(); assert root.joinpath('assets', 'branding', 'vipp-mark.svg').is_file(); assert root.joinpath('compute_policies', 'phase1-gpu-public-v10.json').is_file(); assert any(root.joinpath('examples').iterdir())"
          python -c "from importlib.metadata import distribution; points = {(point.group, point.name, point.value) for point in distribution('napari-vipp').entry_points}; expected = {('console_scripts', 'vipp', 'napari_vipp.__main__:main'), ('console_scripts', 'vipp-compute-doctor', 'napari_vipp.core.compute_diagnostics:main'), ('console_scripts', 'vipp-install-plan', 'napari_vipp.installer.cli:main'), ('gui_scripts', 'vipp-app', 'napari_vipp.launcher:main_auto'), ('gui_scripts', 'vipp-cpu', 'napari_vipp.launcher:main_cpu'), ('gui_scripts', 'vipp-prefer-gpu', 'napari_vipp.launcher:main_prefer_gpu')}; assert expected <= points"
          vipp-compute-doctor --help
          vipp-install-plan --help
          python -c "import json, pathlib, shutil, subprocess, sys, tempfile; command = shutil.which('vipp-install-plan'); assert command; root = pathlib.Path(tempfile.mkdtemp(prefix='vipp-plan-wheel-')); target = root / 'target'; result = subprocess.run([command, 'plan', '--mode', 'managed', '--track', 'cpu', '--base-python', sys.executable, '--install-root', str(target), '--shortcuts', 'none'], capture_output=True, text=True, timeout=30); document = json.loads(result.stdout); assert result.returncode == 2; assert document['schema'] == 'napari-vipp-install-plan'; assert document['mutation_performed'] is False; assert not target.exists()"

      - name: Retain distributions for clean-install jobs
        uses: actions/upload-artifact@v6
        with:
          name: python-distributions-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  clean-distribution-install:
    name: Clean ${{ matrix.archive }} install (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every supported OS installs both published formats. Alternating the
          # Python version also exercises the complete 3.12/3.13 support range
          # without multiplying this into a twelve-job package matrix.
          - os: windows-latest
            python-version: "3.12"
            archive: wheel
          - os: windows-latest
            python-version: "3.13"
            archive: sdist
          - os: ubuntu-latest
            python-version: "3.12"
            archive: sdist
          - os: ubuntu-latest
            python-version: "3.13"
            archive: wheel
          - os: macos-latest
            python-version: "3.12"
            archive: wheel
          - os: macos-latest
            python-version: "3.13"
            archive: sdist

    steps:
      - name: Check out repository for path-isolation checks
        uses: actions/checkout@v7

      - name: Set up clean Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download the distributions built by the quality job
        uses: actions/download-artifact@v7
        with:
          name: python-distributions-${{ github.sha }}
          path: clean-dist

      - name: Install exactly one distribution into the clean job environment
        run: >-
          python -c "import pathlib, subprocess, sys;
          pattern = '*.whl' if sys.argv[1] == 'wheel' else '*.tar.gz';
          files = sorted(pathlib.Path('clean-dist').glob(pattern));
          assert len(files) == 1, (pattern, files);
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--prefer-binary', str(files[0])])"
          "${{ matrix.archive }}"

      - name: Verify installed package, resources, and headless entry points
        run: |
          python -m pip check
          python -c "from importlib.metadata import distribution, version; from importlib.resources import files; from pathlib import Path; import napari_vipp; repo = Path.cwd().resolve(); installed = Path(napari_vipp.__file__).resolve(); assert repo not in installed.parents, (repo, installed); assert napari_vipp.__version__ == version('napari-vipp'); root = files('napari_vipp'); assert root.joinpath('napari.yaml').is_file(); assert root.joinpath('compute_policies', 'phase1-gpu-public-v10.json').is_file(); points = {(point.group, point.name) for point in distribution('napari-vipp').entry_points}; assert {('console_scripts', 'vipp-compute-doctor'), ('console_scripts', 'vipp-install-plan')} <= points"
          python -c "import numpy as np; from napari_vipp.core.operations import gaussian_blur; source = np.arange(63, dtype=np.float32).reshape(7, 9); result = gaussian_blur(source, sigma=1.0); assert result.shape == source.shape; assert np.isfinite(result).all()"
          vipp-compute-doctor --help
          python -c "import json, shutil, subprocess, sys; from napari_vipp.core.compute_specs import accelerator_compute_specs; command = shutil.which('vipp-compute-doctor'); assert command; result = subprocess.run([command, '--json'], capture_output=True, text=True, timeout=60); assert result.returncode in (0, 2), result.stderr; document = json.loads(result.stdout); assert document['schema_version'] == 2; assert document['status'] in {'available', 'degraded', 'unavailable', 'unsupported', 'misconfigured'}; supported_surface = (sys.platform == 'win32' or sys.platform.startswith('linux')) and sys.implementation.name == 'cpython' and sys.version_info[:2] == (3, 12); expected_count = sum(spec.visible_for(allow_experimental=False) for spec in accelerator_compute_specs()) if supported_surface else 0; assert document['public_admission']['total_count'] == expected_count, document['public_admission']; assert supported_surface or document['status'] == 'unsupported'"
          vipp-install-plan --help

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    env:
      PYTEST_QT_API: pyqt6
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

name: Publish tagged distributions to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub prerelease tag to publish (for example v0.13.0a5)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish exact GitHub release distributions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/napari-vipp/
    permissions:
      contents: read

    steps:
      - name: Check out the requested tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify tag and download exactly its distributions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$RELEASE_TAG" = "v$version"
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
          git merge-base --is-ancestor "$RELEASE_TAG^{}" origin/main
          release=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName)
          test "$(jq -r .tagName <<<"$release")" = "$RELEASE_TAG"
          test "$(jq -r .isDraft <<<"$release")" = "false"
          test "$(jq -r .isPrerelease <<<"$release")" = "true"
          mkdir distributions
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "napari_vipp-$version-py3-none-any.whl" \
            --pattern "napari_vipp-$version.tar.gz" \
            --dir distributions
          test "$(find distributions -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check distributions/*

      - name: Publish to PyPI with the protected project token
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: distributions/
          password: ${{ secrets.PYPI_API_TOKEN }}
